name: YouTube Comment Responder

on:
  schedule:
    # Har 6 soatda
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: youtube-comments
  cancel-in-progress: true

jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: youtube-orchestrator
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: youtube-orchestrator/requirements.txt

      - run: pip install -r requirements.txt

      - name: Reply to comments
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python comment_runner.py

      - name: Persist reply state
        run: |
          if git diff --quiet topics/_replied.json 2>/dev/null; then
            echo "Hech narsa o'zgarmadi."
          else
            git config user.name "youtube-orchestrator"
            git config user.email "actions@users.noreply.github.com"
            git add topics/_replied.json
            git commit -m "chore(youtube): update reply state"
            git push
          fi

name: YouTube Pipeline

on:
  schedule:
    # Har kuni 09:00 UTC = 14:00 Toshkent
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      topic:
        description: "Ixtiyoriy: aniq mavzu (bo'sh qoldirilsa queue'dan oladi)"
        required: false
        type: string
      dry_run:
        description: "DRY-RUN (YouTube'ga yuklamasdan)"
        required: false
        type: boolean
        default: false

# Faqat youtube-orchestrator/ ga tegishli — boshqa hech narsaga ta'sir qilmaydi
permissions:
  contents: write

concurrency:
  group: youtube-pipeline
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: youtube-orchestrator
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: youtube-orchestrator/requirements.txt

      - name: Install system deps (ffmpeg, fonts)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          # MAJBURIY: YouTube'ga yuklash uchun
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          # IXTIYORIY: bo'lmasa Pollinations.ai (bepul, kalitsiz) ishlatiladi
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_DATA_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.topic }}" ]; then
            ARGS="--topic \"${{ github.event.inputs.topic }}\""
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          eval python orchestrator.py $ARGS

      - name: Commit topic queue changes
        if: github.event.inputs.dry_run != 'true'
        run: |
          if git diff --quiet topics/queue.txt topics/done.txt 2>/dev/null; then
            echo "Queue o'zgarmadi."
          else
            git config user.name "youtube-orchestrator"
            git config user.email "actions@users.noreply.github.com"
            git add topics/queue.txt topics/done.txt
            git commit -m "chore(youtube): topic published"
            git push
          fi

name: Build Desktop (Windows + macOS)

# Windows (.exe / setup) va macOS (.dmg) o'rnatish fayllarini avtomatik quradi.
# Ishga tushirish: GitHub → Actions → "Build Desktop (Windows + macOS)" → Run workflow,
# yoki v* tegi push qilinganda avtomatik.
#
# Sozlamalar (Settings → Secrets and variables → Actions → Variables):
#   VITE_API_BASE  — bulutdagi Vercel manzili (masalan https://soneee.vercel.app).
#                    .exe va .dmg shu manzil orqali bir xil ma'lumotga ulanadi.
#   MICROSIP_URL   — (ixtiyoriy, faqat Windows) MicroSIP portable ZIP havolasi.
#                    Berilsa, yuklab olinib .exe ichiga bundle qilinadi.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: ipost-crm-windows
            args: ""
            bundle_glob: "src-tauri/target/release/bundle/nsis/*.exe"
          - os: macos-latest
            artifact: ipost-crm-macos
            args: "--target universal-apple-darwin"
            bundle_glob: "src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm install

      - uses: dtolnay/rust-toolchain@stable

      - name: Add macOS universal targets
        if: ${{ matrix.os == 'macos-latest' }}
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Download & bundle MicroSIP (faqat Windows, ixtiyoriy)
        if: ${{ matrix.os == 'windows-latest' && vars.MICROSIP_URL != '' }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/microsip | Out-Null
          Invoke-WebRequest -Uri "${{ vars.MICROSIP_URL }}" -OutFile microsip.zip
          Expand-Archive -Path microsip.zip -DestinationPath src-tauri/microsip -Force
          Get-ChildItem -Recurse src-tauri/microsip

      - name: Build Tauri (setup fayl)
        env:
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
        run: npm run tauri:build -- ${{ matrix.args }}

      - name: Upload setup
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.bundle_glob }}
          if-no-files-found: error

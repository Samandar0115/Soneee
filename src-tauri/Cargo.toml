[package]
name = "ipost-crm"
version = "1.0.0"
description = "iPOST CRM — Call Center & Logistika ish stoli ilovasi"
authors = ["iPOST"]
edition = "2021"

[lib]
name = "ipost_crm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
